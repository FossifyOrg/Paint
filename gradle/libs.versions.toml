[versions]
junit = "4.13.2"
robolectric = "4.17"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
clipper2 = "2.0.1b"
#jetbrains
kotlin = "2.3.10"
#Detekt
detekt = "1.23.8"
detektCompose = "0.4.28"
#AndroidX
androidx-print = "1.1.0"
#Fossify
commons = "7.1.2"
#Gradle
gradlePlugins-agp = "9.4.1"
#build
app-build-compileSDKVersion = "36"
app-build-targetSDK = "36"
app-build-minimumSDK = "26"
app-build-javaVersion = "VERSION_17"
app-build-kotlinJVMTarget = "17"
[libraries]
clipper2 = { module = "com.github.micycle1:Clipper2-java", version.ref = "clipper2" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
#AndroidX
androidx-print = { module = "androidx.print:print", version.ref = "androidx-print" }
#Compose
compose-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "detektCompose" }
#Fossify
fossify-commons = { module = "org.fossify:commons", version.ref = "commons" }
[plugins]
android = { id = "com.android.application", version.ref = "gradlePlugins-agp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
